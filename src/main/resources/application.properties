spring.application.name=cdk-mps-plugin
server.port=8088

plugin.technology=AWS CDK
plugin.analysis-type=STATIC

analysis-manager.plugin-registration.url=http://localhost:8080/plugin-registration
models-service.url=http://localhost:8081

messaging.analysistask.response.exchange.name=AnalysisTaskResponseExchange

# MPS headless generator (paths relative to project-dir, see mps-transformation-awscdk/build.xml)
mps.generator.project-dir=mps-transformation-awscdk
mps.generator.model-input-path=languages/AWSCDK.sandbox/models/AWSCDK.sandbox.mps
mps.generator.output-dir=languages/AWSCDK.sandbox/source_gen

# Per-process parser output (cdkDeploymentModel.json) and transformation output (result.yaml)
output.debug-dir=/usr/share/cdk-mps-plugin

# Logging
spring.main.banner-mode=log
logging.file.name=cdk-mps-plugin.log
