# Runs Build without Docker
name: workflow-build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'main'
      - 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      # Matches the JRE the image runs on (eclipse-temurin:11-jre)
      - uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # validates, compiles, tests and packages it
      - name: Build Project
        run: ./mvnw --batch-mode package
